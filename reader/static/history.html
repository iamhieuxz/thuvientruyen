<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E1A">
<meta name="robots" content="noindex">
<meta name="description" content="Lịch sử đọc của bạn trên truyendochay: mỗi phiên đọc và nghe, gom theo ngày giờ máy, lưu ngay trên trình duyệt.">
<title>Lịch sử đọc · truyendochay</title>
<link rel="icon" href="/static/img/logo.png">
<link rel="stylesheet" href="/static/home.css">
<link rel="stylesheet" href="/static/history.css">
</head>
<body>

<a class="skip" href="#content">Tới nội dung chính</a>

<!-- ======== icon rail trái (giống trang chủ, nút đồng hồ đang bật) ======== -->
<nav class="irail" aria-label="Điều hướng chính">
  <a class="irail-brand" href="/" aria-label="truyendochay, về trang chủ">
    <img src="/static/img/logo.png" alt="" width="34" height="34">
  </a>
  <div class="irail-group">
    <a class="irail-btn" href="/" title="Trang chủ" aria-label="Trang chủ">
      <svg viewBox="0 0 24 24"><path d="M3 11.2 12 4l9 7.2M5.5 9.8V20h13V9.8M9.8 20v-5.4h4.4V20"/></svg>
    </a>
    <a class="irail-btn is-on" href="/lich-su" aria-current="page" title="Lịch sử đọc theo ngày" aria-label="Lịch sử đọc theo ngày">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.4V12l3.2 2"/></svg>
    </a>
  </div>
  <a class="irail-btn irail-end" href="/" title="Hồ sơ đọc của bạn" aria-label="Về trang chủ">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.6"/><path d="M4.8 20a7.3 7.3 0 0 1 14.4 0"/></svg>
  </a>
</nav>

<!-- ======== top nav ======== -->
<header class="topnav">
  <a class="tn-brand" href="/">
    <img src="/static/img/logo.png" alt="" width="30" height="30">
    <span>truyendochay<i>.reader</i></span>
  </a>
</header>

<!-- ======== nội dung: một cột, không sidebar ======== -->
<main class="shell shell-one" id="content">
  <div class="content">

    <header class="hhead">
      <div>
        <h1>Lịch sử đọc</h1>
        <p class="hsub">Mỗi phiên đọc và nghe, gom theo ngày giờ máy của bạn — dữ liệu nằm ngay trên trình duyệt này.</p>
      </div>
      <a class="btn btn-ghost" href="/">← Về trang chủ</a>
    </header>

    <section class="hsum" id="hsum" aria-label="Tổng kết 30 ngày qua" aria-busy="true"></section>

    <section class="hdays" id="hdays" aria-label="Các phiên đọc theo ngày" aria-busy="true"></section>

    <footer class="foot">
      <span><b>truyendochay</b> · đọc đêm, đọc cháy</span>
      <span>Giữ tối đa 500 phiên đọc gần nhất</span>
    </footer>

  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/store.js"></script>
<script src="/static/covers.js"></script>
<script src="/static/history.js"></script>
</body>
</html>
